name: Rebuild Dashboard

# Keeps wine.html in sync with SHOPS and prices.yaml. The page is a
# generated artifact committed to the repo, so GitHub Pages can serve it
# without a build step.
on:
  push:
    branches: [main]
    paths:
      - scraper.py
      - prices.yaml
      - dashboard.py
  workflow_dispatch: {}

permissions:
  contents: write
  # Read-only, and only to ask whether Pages actually published the page this
  # job just generated. See the last step.
  actions: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate wine.html
        run: python dashboard.py

      - name: Commit if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- wine.html; then
            echo "Dashboard already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wine.html
          git commit -m "Rebuild dashboard [skip ci]"

          # Never rebase this one. The probe and apply-config both push to
          # main and both rebuild this file, so a race is normal -- and a
          # rebase of a generated file only ever produces a conflict whose
          # correct resolution is "regenerate it". So: take theirs, rebuild
          # on top, and if their copy is already current there was nothing
          # to say. A probe run died on exactly this conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebuilding on the new head."
            git fetch origin "$BRANCH" || exit 1
            git reset --hard "origin/$BRANCH" || exit 1
            python dashboard.py
            if git diff --quiet -- wine.html; then
              echo "Someone else already rebuilt it."
              exit 0
            fi
            git add wine.html
            git commit -m "Rebuild dashboard [skip ci]"
          done
          echo "Could not push after 3 attempts."
          exit 1

      # Generating the page is not publishing it, and the gap is silent.
      # wine.html is committed here; GitHub Pages deploys it separately -- and
      # when a Pages deployment wedges, every later one is refused with
      # "Deployment request failed ... due to in progress deployment". This
      # workflow goes on reporting success while the live page stays frozen.
      # It stayed frozen across four rebuilds on 2026-11-01, and the only
      # symptom anyone noticed was a button that would not appear.
      #
      # This reads the *previous* deployment, because the one for this push
      # has not started yet. That is the right question anyway: a wedge is a
      # standing condition, so "is Pages failing right now" is what catches
      # it -- within one rebuild rather than never.
      - name: Check GitHub Pages is actually publishing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Written out rather than nested inside a command substitution:
          # tests/test_workflows.py reads every expansion and cannot see a
          # quoted variable through "$( ... )", and the test is right to be
          # strict about the shape even when this instance is safe.
          gh api "repos/$REPO/actions/runs?per_page=30" \
            --jq '[.workflow_runs[]
                   | select(.name == "pages build and deployment")][0].conclusion' \
            > "$RUNNER_TEMP/pages-conclusion.txt"
          # `read` rather than "$(cat ...)": a command substitution wrapping a
          # quoted variable is the shape the expansion check rejects, and an
          # empty file would otherwise abort the step under `bash -e`.
          read -r conclusion < "$RUNNER_TEMP/pages-conclusion.txt" \
            || conclusion="unknown"
          echo "Last GitHub Pages deployment concluded: $conclusion"
          if [ "$conclusion" = "failure" ]; then
            echo "::error::GitHub Pages is not publishing. The last deployment failed, so the live page is stale however often this workflow succeeds. Re-run the failed 'pages build and deployment' run, or cancel the stuck deployment under Settings -> Pages."
            exit 1
          fi
