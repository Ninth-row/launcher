name: Rebuild Dashboard

# Keeps wine.html in sync with SHOPS and prices.yaml. The page is a
# generated artifact committed to the repo, so GitHub Pages can serve it
# without a build step.
on:
  push:
    branches: [main]
    paths:
      - scraper.py
      - prices.yaml
      - dashboard.py
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate wine.html
        run: python dashboard.py

      - name: Commit if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- wine.html; then
            echo "Dashboard already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wine.html
          git commit -m "Rebuild dashboard [skip ci]"

          # Never rebase this one. The probe and apply-config both push to
          # main and both rebuild this file, so a race is normal -- and a
          # rebase of a generated file only ever produces a conflict whose
          # correct resolution is "regenerate it". So: take theirs, rebuild
          # on top, and if their copy is already current there was nothing
          # to say. A probe run died on exactly this conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebuilding on the new head."
            git fetch origin "$BRANCH" || exit 1
            git reset --hard "origin/$BRANCH" || exit 1
            python dashboard.py
            if git diff --quiet -- wine.html; then
              echo "Someone else already rebuilt it."
              exit 0
            fi
            git add wine.html
            git commit -m "Rebuild dashboard [skip ci]"
          done
          echo "Could not push after 3 attempts."
          exit 1
