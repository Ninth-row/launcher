name: Apply Config Issue

# Turns a Producer / Shop issue form into a committed config change.
#
# Commits straight to main rather than opening a pull request: the owner is
# the only person who can trigger it, the full test suite must pass first,
# and everything is revertible through git. Requiring a PR merge for "change
# a price" was pure ceremony.
#
# SECURITY: this repo is public, so anyone can open an issue and issue forms
# apply their own labels. The job refuses to act unless the issue author
# actually holds write access to this repository -- otherwise a stranger
# could drive edits to scraper.py. apply_issue.py independently rejects
# hostile values (quote injection, path traversal, non-https URLs); the
# permission check below is the outer of the two.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    # Matches on the form's own headings as well as the label. GitHub only
    # applies a template's labels if they already exist in the repo, so a
    # missing label silently skipped a correctly-submitted form -- which is
    # exactly what happened to issue #20. This condition only identifies
    # which form was submitted. The security gate is the permission check
    # that runs as the first step of the job.
    #
    # author_association used to be that gate and must never be one again.
    # It is not a permission, it is a *visibility*: on a repo owned by an
    # organisation, a member whose org membership is set to private is
    # reported as CONTRIBUTOR or NONE, so an owner with full admin rights
    # fails an OWNER-or-MEMBER test. This project moved to an org and every
    # single run of this workflow concluded "skipped" from then on -- ten of
    # them, across five issues, each one a form the owner had filled in
    # correctly. A skipped job posts no comment and shows no red tick, so
    # the failure was invisible from both the issue and the dashboard.
    if: >
      contains(github.event.issue.labels.*.name, 'add-producer') ||
      contains(github.event.issue.labels.*.name, 'add-shop') ||
      contains(github.event.issue.body, '### Producer name') ||
      contains(github.event.issue.body, '### Short name')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The security gate. Asks GitHub what the author may actually do here
      # rather than inferring it from a label they applied to themselves or
      # from an association that depends on a profile setting.
      #
      # admin and maintain only. Plain write is deliberately excluded and
      # must stay excluded: someone given push access to help is not someone
      # who should be able to drive an unreviewed commit to main from an
      # issue form. That was the old gate's policy and it is still right;
      # only its mechanism was broken.
      #
      # It runs before anything reads the issue body, so an unauthorised
      # issue costs one API call and stops. It also says so on the issue:
      # the whole point of this rewrite is that a refusal is visible.
      - name: Check the author may change config
        id: authz
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.payload.issue.user.login;
            const assoc = context.payload.issue.author_association;
            let level = 'none';
            try {
              const res = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner, repo: context.repo.repo,
                username: actor,
              });
              level = res.data.permission;
            } catch (e) {
              core.info(`permission lookup failed for ${actor}: ${e.status}`);
            }
            core.info(`author=${actor} association=${assoc} permission=${level}`);
            if (['admin', 'maintain'].includes(level)) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Not applied: **@${actor}** does not have admin access to this `
                + `repository, so this form cannot change the config `
                + `(permission reported as \`${level}\`).`
                + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });
            core.setFailed(`${actor} has permission "${level}"; admin access required.`);

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide what kind of request this is
        id: kind
        env:
          IS_PRODUCER_LABEL: ${{ contains(github.event.issue.labels.*.name, 'add-producer') }}
          IS_SHOP_LABEL: ${{ contains(github.event.issue.labels.*.name, 'add-shop') }}
          HAS_PRODUCER_HEADING: ${{ contains(github.event.issue.body, '### Producer name') }}
        run: |
          if [ "$IS_PRODUCER_LABEL" = "true" ] || \
             { [ "$IS_SHOP_LABEL" != "true" ] && [ "$HAS_PRODUCER_HEADING" = "true" ]; }; then
            echo "kind=producer" >> "$GITHUB_OUTPUT"
          else
            echo "kind=shop" >> "$GITHUB_OUTPUT"
          fi

      - name: Write issue body to a file
        env:
          # Via env, never inlined into the script, so the body cannot be
          # interpreted as shell.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > issue_body.md

      - name: Apply the change
        id: apply
        env:
          APPLY_KIND: ${{ steps.kind.outputs.kind }}
        run: |
          python apply_issue.py --kind "$APPLY_KIND" --body-file issue_body.md
          {
            echo 'summary<<APPLY_EOF'
            cat apply_summary.txt
            echo
            echo 'APPLY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate dashboard
        run: python dashboard.py

      # Nothing is committed unless the suite is green, so a malformed edit
      # can never land on main.
      - name: Run tests
        run: pytest tests/ -q

      - name: Commit to main
        env:
          # Both through the environment. The summary is derived from an
          # issue body, i.e. text from outside, and splicing that into a
          # shell string is how a stray quote or $(...) would get to run --
          # the same lesson the github-script step below already carries.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPLY_SUMMARY: ${{ steps.apply.outputs.summary }}
        run: |
          rm -f issue_body.md apply_summary.txt
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "no_changes=true" >> "$GITHUB_ENV"
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "Config change from issue #${ISSUE_NUMBER}" \
            -m "${APPLY_SUMMARY}" \
            -m "Applied by .github/workflows/apply-config.yml after tests passed."
          git push
          echo "committed=true" >> "$GITHUB_ENV"

      - name: Comment and close the issue
        uses: actions/github-script@v7
        env:
          # Via env, never interpolated into the script body: the summary
          # contains backticks, which closed the template literal early and
          # crashed this step *after* the commit had landed -- so the
          # failure handler then reported "nothing was committed", which
          # was false.
          APPLY_SUMMARY: ${{ steps.apply.outputs.summary }}
        with:
          script: |
            const noChanges = process.env.no_changes === 'true';
            const summary = process.env.APPLY_SUMMARY || '';
            const sha = require('child_process').execSync('git rev-parse HEAD').toString().trim();
            const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const body = noChanges
              ? 'Nothing to change — the config already looks like that.'
              : 'Applied and pushed to `main` — [' + sha.slice(0, 7) + '](' + link + ').\n\n' + summary;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });

      # Skipped when the permission check is what failed: that step has
      # already said why, precisely, and two bot comments on one refusal is
      # noise on a public repo.
      - name: Report failure on the issue
        if: failure() && steps.authz.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: (process.env.committed === 'true'
                ? 'The change **was committed to `main`**, but a later step of the run failed. '
                  + 'Check the config before retrying -- re-applying the label would apply it twice. '
                : 'Could not apply this, and nothing was committed. ')
                + `See the [run log](${run}) for details.`
                + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });
